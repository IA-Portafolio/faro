version: "3.9"

# Stack de producción para faro.iaportafolio.com (desplegado en infra-iaportafolio).
# El ingreso público lo gestiona el Caddy existente de tokenscounter. Nos unimos
# a su red (tokenscounter_default) para que Caddy alcance backend / frontend por
# nombre de contenedor.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: faro-clickhouse
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: faro
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-faro}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config/users.d/faro.xml:/etc/clickhouse-server/users.d/faro.xml:ro
    networks: [faro-internal]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: faro-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [faro-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: faro-backend
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FARO_BIND_ADDR: 0.0.0.0:4318
      FARO_OTLP_GRPC_ADDR: 0.0.0.0:4317
      FARO_API_ADDR: 0.0.0.0:8080
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: faro
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-faro}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      REDIS_URL: redis://redis:6379
      FARO_BOOTSTRAP_PROJECT_SLUG: ${FARO_BOOTSTRAP_PROJECT_SLUG:-default}
      FARO_BOOTSTRAP_PROJECT_NAME: ${FARO_BOOTSTRAP_PROJECT_NAME:-Default}
      FARO_BOOTSTRAP_INGEST_TOKEN: ${FARO_BOOTSTRAP_INGEST_TOKEN:-}
      FARO_BOOTSTRAP_ADMIN_EMAIL: ${FARO_BOOTSTRAP_ADMIN_EMAIL:-}
      FARO_BOOTSTRAP_ADMIN_PASSWORD: ${FARO_BOOTSTRAP_ADMIN_PASSWORD:-}
      FARO_BOOTSTRAP_ADMIN_NAME: ${FARO_BOOTSTRAP_ADMIN_NAME:-Admin}
      FARO_PUBLIC_BASE_URL: ${FARO_PUBLIC_BASE_URL:-https://faro.iaportafolio.com}
      # Orígenes permitidos del dashboard. SIN esta var el backend cae al branch DEV
      # de `dashboard_cors` (cualquier origen, sin credenciales) AUNQUE esté en prod —
      # el hardening de CORS configurado nunca entraba en vigor. Con la var, el browser
      # sólo envía la cookie de sesión hacia los orígenes conocidos.
      FARO_DASHBOARD_ORIGINS: ${FARO_DASHBOARD_ORIGINS:-https://faro.iaportafolio.com}
      # HSTS a nivel app (defensa en profundidad; Caddy también puede inyectarlo). En
      # prod la TLS es estable vía Caddy, así que es seguro encenderlo.
      FARO_ENABLE_HSTS: ${FARO_ENABLE_HSTS:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Bearer token requerido por /metrics. El handler es FAIL-CLOSED: si la var no
      # está, /metrics devuelve 401 (no expone métricas). En prod debe estar igual —
      # el stack Observability la usa para scrapear.
      FARO_METRICS_TOKEN: ${FARO_METRICS_TOKEN:-}
      RUST_LOG: ${RUST_LOG:-info,faro=info}
    networks: [faro-internal, ingress-caddy]
    healthcheck:
      # /readyz para que Compose considere healthy sólo cuando CH también responde.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_BASE: https://faro.iaportafolio.com
    container_name: faro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      ORIGIN: https://faro.iaportafolio.com
      PUBLIC_API_BASE: https://faro.iaportafolio.com
    networks: [faro-internal, ingress-caddy]

volumes:
  clickhouse_data:
  redis_data:

networks:
  faro-internal:
    driver: bridge
  # La provee el proyecto compose de tokenscounter — ahí vive Caddy.
  ingress-caddy:
    external: true
    name: tokenscounter_default
