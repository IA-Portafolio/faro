name: e2e

# Test end-to-end del dashboard con browser real (Playwright): frontend SvelteKit →
# backend Rust → ClickHouse, detrás de un Caddy que los pone en el MISMO origen
# (como prod). Caza la clase de bug que los component tests (con fetch mockeado) NO
# pueden: cookie de sesión, CORS, y la integración real frontend↔backend.
#
# Levanta el stack efímero de docker-compose.e2e.yml (CH + Redis + backend +
# frontend + Caddy), seedea un admin de test, y corre `npm run test:e2e`.

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'clickhouse/**'
      - 'docker-compose.e2e.yml'
      - 'infra/e2e/**'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'clickhouse/**'
      - 'docker-compose.e2e.yml'
      - 'infra/e2e/**'
      - '.github/workflows/e2e.yml'

# Least-privilege: sólo checkout + levantar el stack + correr tests; no publica nada.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 40
    env:
      # Creds de TEST seedeadas por docker-compose.e2e.yml (NO son secretos).
      FARO_E2E_BASE_URL: https://localhost:8889
      FARO_E2E_EMAIL: e2e@test.local
      FARO_E2E_PASSWORD: e2e-password-123
      COMPOSE: docker compose -f docker-compose.e2e.yml

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      # En CI NO seteamos FARO_E2E_BACKEND_IMAGE → el backend se construye fresco
      # (tag `faro-e2e-backend`), sin tocar ninguna imagen de prod.
      - name: Build + start e2e stack
        run: $COMPOSE up -d --build --wait

      - name: Install Playwright (chromium)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: frontend
        run: npm run test:e2e

      - name: Stack logs on failure
        if: failure()
        run: |
          echo "::group::backend"; $COMPOSE logs --tail=120 backend || true; echo "::endgroup::"
          echo "::group::frontend"; $COMPOSE logs --tail=80 frontend || true; echo "::endgroup::"
          echo "::group::caddy"; $COMPOSE logs --tail=40 caddy || true; echo "::endgroup::"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: $COMPOSE down -v || true
