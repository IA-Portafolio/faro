name: deploy

# Push a `main` → rsync de la copia checkouteada hacia /opt/faro y rebuild.
# Corre en el runner self-hosted que vive dentro de infra-iaportafolio, así
# no necesita SSH ni Tailscale en el runner: hace todo en local.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# El deploy sólo checkoutea + rsync local + docker + curl; no usa el
# GITHUB_TOKEN para push/release. Least-privilege explícito.
permissions:
  contents: read

concurrency:
  group: deploy-faro
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, faro-deploy]
    timeout-minutes: 30
    env:
      FARO_DIR: /opt/faro
      COMPOSE: docker compose -f docker-compose.prod.yml --env-file .env.prod

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Sync source to ${{ env.FARO_DIR }}
        # --delete para limpiar archivos eliminados del repo; conserva .env.prod,
        # backups y volúmenes via la lista de excludes.
        #
        # `backups/` está en .gitignore → NO existe en el checkout (origen ./).
        # Sin excluirlo, `--delete` borraría /opt/faro/backups/ (los tarballs e
        # imágenes-source de rollback) en cada deploy. Idem .lycheecache y
        # .playwright-mcp (artefactos locales del host, no del repo).
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='target' \
            --exclude='.svelte-kit' \
            --exclude='build' \
            --exclude='.gradle' \
            --exclude='.env' \
            --exclude='.env.prod' \
            --exclude='*.bak.*' \
            --exclude='backups' \
            --exclude='backups/' \
            --exclude='.lycheecache' \
            --exclude='.playwright-mcp' \
            ./ "$FARO_DIR/"

      - name: Apply pending ClickHouse migrations
        # Las migraciones están escritas para ser idempotentes (CREATE TABLE IF NOT
        # EXISTS, ADD COLUMN IF NOT EXISTS), así que aplicar todas no es destructivo.
        run: |
          CH_PASS=$(grep '^CLICKHOUSE_PASSWORD=' "$FARO_DIR/.env.prod" | cut -d= -f2-)
          if [ -d "$FARO_DIR/clickhouse/migrations" ]; then
            for m in "$FARO_DIR/clickhouse/migrations"/*.sql; do
              [ -f "$m" ] || continue
              echo "::group::Applying $(basename "$m")"
              docker exec -i faro-clickhouse \
                clickhouse-client --user=faro --password="$CH_PASS" \
                --database=faro --multiquery < "$m"
              echo "::endgroup::"
            done
          fi

      - name: Build images
        working-directory: ${{ env.FARO_DIR }}
        run: $COMPOSE build

      - name: Apply & restart
        working-directory: ${{ env.FARO_DIR }}
        run: $COMPOSE up -d --remove-orphans

      - name: Readiness check via public domain
        id: readyz
        # /readyz (no /healthz) — queremos que el deploy falle si CH no está
        # accesible tras el arranque, no que pase verde sólo porque el proceso bindea.
        run: |
          for i in $(seq 1 40); do
            if curl -fsS https://faro.iaportafolio.com/readyz >/dev/null; then
              echo "Faro ready ✓"
              exit 0
            fi
            sleep 3
          done
          echo "::error::readyz never returned 200 after 120s"
          curl -sS -o /dev/null -w "last readyz status: %{http_code}\n" https://faro.iaportafolio.com/readyz || true
          curl -sS https://faro.iaportafolio.com/readyz || true
          docker compose -f "$FARO_DIR/docker-compose.prod.yml" --env-file "$FARO_DIR/.env.prod" logs --tail=80 backend
          exit 1

      - name: Smoke test post-deploy
        id: smoke
        # Round-trip real contra el dominio público: login + ingest + query + healthz/protocol.
        # Cubre el caso "readyz verde pero la auth/ingesta/CH están rotas": readyz solo pinguea
        # ClickHouse, no valida que el camino completo de un log de cliente hasta su lectura
        # en el dashboard funciona. Si esto falla, el job queda rojo (notificación) y el step
        # `Smoke diagnostics` de abajo vuelca logs para debug. Rollback queda manual a
        # propósito: las imágenes no están tageadas por SHA, así que el rollback automático
        # supondría re-buildear el commit anterior — más invasivo que el propio fix.
        #
        # Las creds del smoke user + token de proyecto viven en /opt/faro/.env.prod junto al
        # resto del state secreto. Si no existen todavía, el script imprime ::warning:: y
        # se salta los pasos que dependen de ellas (sólo corre healthz). Esto evita romper
        # el primer deploy que introduce el smoke; el segundo deploy ya debería tener
        # esas vars configuradas (ver .env.prod.template para los nombres exactos).
        working-directory: ${{ env.FARO_DIR }}
        env:
          FARO_BASE_URL: https://faro.iaportafolio.com
          FARO_EXPECTED_PROTOCOL: '1'
        run: |
          set -a
          # `|| true` para que la línea no se rompa si la var no está en el file.
          FARO_SMOKE_EMAIL=$(grep '^FARO_SMOKE_EMAIL=' .env.prod | cut -d= -f2- || true)
          FARO_SMOKE_PASSWORD=$(grep '^FARO_SMOKE_PASSWORD=' .env.prod | cut -d= -f2- || true)
          FARO_SMOKE_INGEST_TOKEN=$(grep '^FARO_SMOKE_INGEST_TOKEN=' .env.prod | cut -d= -f2- || true)
          set +a
          bash scripts/smoke-post-deploy.sh

      - name: Smoke diagnostics on failure
        if: failure() && steps.smoke.conclusion == 'failure'
        # Vuelca últimos logs del backend y CH para que el rollback manual tenga
        # contexto. No corre si el fallo fue antes del smoke (build/readyz) — esos
        # ya hicieron su propio dump.
        working-directory: ${{ env.FARO_DIR }}
        run: |
          echo "::group::backend logs (tail 200)"
          docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=200 backend || true
          echo "::endgroup::"
          echo "::group::clickhouse logs (tail 100)"
          docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=100 clickhouse || true
          echo "::endgroup::"
          echo "::group::healthz (raw)"
          curl -sS https://faro.iaportafolio.com/healthz || true
          echo
          echo "::endgroup::"
          echo "::group::readyz (raw)"
          curl -sS https://faro.iaportafolio.com/readyz || true
          echo
          echo "::endgroup::"
          echo "::error::smoke FAIL — revisar logs arriba y, si la regresión es del binario, hacer rollback con 'git revert <sha> && git push' (las imágenes no están tageadas por SHA, no hay re-tag local instantáneo)."

      - name: Notify on failure (Telegram, best-effort)
        # Antes, un deploy roto sólo se notaba mirando la pestaña Actions (MTTR alto,
        # dependiente de vigilancia manual). Esto avisa por Telegram en cuanto algún
        # step falla (build/readyz/smoke), reusando el TELEGRAM_BOT_TOKEN que ya vive
        # en .env.prod. Requiere además FARO_DEPLOY_ALERT_CHAT_ID en .env.prod; si
        # falta, sólo emite un ::warning:: (no rompe nada más). Best-effort: no altera
        # el estado del job (que ya está en rojo).
        if: failure()
        working-directory: ${{ env.FARO_DIR }}
        run: |
          TG_TOKEN=$(grep '^TELEGRAM_BOT_TOKEN=' .env.prod | cut -d= -f2- || true)
          TG_CHAT=$(grep '^FARO_DEPLOY_ALERT_CHAT_ID=' .env.prod | cut -d= -f2- || true)
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::warning::deploy falló pero falta TELEGRAM_BOT_TOKEN o FARO_DEPLOY_ALERT_CHAT_ID en .env.prod; sin notificación automática"
            exit 0
          fi
          MSG="🚨 Faro deploy FALLÓ — commit ${GITHUB_SHA:0:7} (${GITHUB_REF_NAME}). Logs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS --max-time 15 -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" >/dev/null \
            && echo "notificación de fallo enviada" \
            || echo "::warning::no se pudo enviar la notificación de Telegram"

      - name: Prune dangling images (best-effort)
        if: always()
        run: docker image prune -f
