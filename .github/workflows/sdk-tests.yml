name: sdk-tests

# Lint + build + **test obligatorio** de cada SDK. Bloquea PRs y, vía el
# `needs:` en publish-sdks.yml, también bloquea cualquier publish a npm/PyPI/
# Maven/pub.dev si los tests fallan.
#
# Antes este workflow toleraba "sin tests" con un grep — esa válvula de escape
# se removió a propósito tras 6.D.3 (no había tests reales en ningún SDK).

on:
  pull_request:
    paths:
      - 'sdks/**'
      - 'backend/**'
      - 'clickhouse/**'
      - 'docker-compose.sdk-integration.yml'
      - '.github/workflows/sdk-tests.yml'
  push:
    branches: [main]
    paths:
      - 'sdks/**'
      - 'backend/**'
      - 'clickhouse/**'
      - 'docker-compose.sdk-integration.yml'
      - '.github/workflows/sdk-tests.yml'

# Least-privilege: ningún job publica ni escribe al repo (los publish viven en
# publish-sdks.yml); sólo checkout + build + test. Sin este bloque el
# GITHUB_TOKEN hereda el default amplio del repo.
permissions:
  contents: read

concurrency:
  group: sdk-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Funciones compartidas + spec ejecutable de paridad cross-SDK (plan M-5).
  # Los SDKs TS (node/nextjs/expo) la consumen vía devDependency file: e
  # inlinean el código en su bundle; este job corre la suite del core.
  sdk-core:
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 10
    defaults: { run: { working-directory: sdks/_shared/sdk-core } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with: { node-version-file: .nvmrc }
      - run: npm install
      - run: npm test

  node:
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 10
    defaults: { run: { working-directory: sdks/node } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with: { node-version-file: .nvmrc }
      - run: npm install
      - run: npm test

  nextjs:
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 10
    defaults: { run: { working-directory: sdks/nextjs } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with: { node-version-file: .nvmrc }
      - run: npm install
      - run: npm test

  expo:
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 10
    defaults: { run: { working-directory: sdks/expo } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with: { node-version-file: .nvmrc }
      - run: npm install
      - run: npm test

  python:
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 10
    defaults: { run: { working-directory: sdks/python } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: '3.11' }
      - name: install (with dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install ruff pytest
      - name: ruff
        run: ruff check . || true   # informativo hasta que el código esté limpio
      - name: build
        run: |
          pip install build
          python -m build
      - name: pytest
        run: pytest

  go:
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 10
    defaults: { run: { working-directory: sdks/go } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        # go.mod pide go 1.25.0 (lo arrastra go.opentelemetry.io/otel v1.44);
        # antes estaba en 1.22 y funcionaba solo por el auto-toolchain de Go.
        with: { go-version: '1.25' }
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      # golangci-lint advisory (no bloquea): el binario `latest` está compilado
      # con go1.24 y no puede typecheckear el módulo que requiere go1.25
      # (otel v1.44) -> "package requires newer Go version go1.25". vet/build/
      # test de arriba son los gates duros. TODO: reactivar como bloqueante
      # cuando golangci-lint publique binarios construidos con go1.25 (o migrar
      # .golangci.yml a formato v2 + install-mode: goinstall con go1.25).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        continue-on-error: true
        with:
          version: latest
          working-directory: sdks/go
          args: --timeout=5m

  flutter:
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 15
    defaults: { run: { working-directory: sdks/flutter } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with: { channel: stable }
      - run: flutter pub get
      # `dart analyze` a secas: con flutter_lints ya en dev_dependencies el
      # warning include_file_not_found desaparece, y los lints de estilo
      # (require_trailing_commas, unnecessary_import) son `info` → NO son
      # fatales por default (solo errors/warnings lo son). La flag
      # `--no-fatal-infos` NO existe en dart analyze (da exit 64).
      # `dart fix --apply` limpia el estilo cuando se quiera.
      - run: dart analyze
      - run: flutter test

  kotlin:
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 20
    defaults: { run: { working-directory: sdks/kotlin } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6
      - name: bootstrap gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
      - run: ./gradlew build --no-daemon
      - run: ./gradlew test --no-daemon

  # Integration: stack real (clickhouse + redis + backend) + Node SDK envía un log
  # y consulta la API para verificar que llegó. Mismo wire que todos los SDKs
  # usan, así que con uno alcanza para detectar regresiones de protocolo.
  #
  # Pre-buildeamos `faro-backend` con buildx + cache=gha en vez de dejarlo a
  # `compose up --build`, porque el builder de compose no usa los exporters
  # de buildx — sin esto cada corrida recompila Rust desde cero (~10 min).
  # Con cargo-chef en el Dockerfile + cache layer en GHA, una corrida que sólo
  # toca src/*.rs baja a ~1-2 min (hit en la layer de `cargo chef cook`).
  integration:
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Build faro-backend image with GHA layer cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # `load: true` mete la imagen al daemon local para que `compose up`
          # (sin --build) la encuentre como faro-backend:integration.
          load: true
          tags: faro-backend:integration
          # scope= namespaceia la cache por uso (no la mezcles con la del
          # workflow release-images, que es multi-arch y vive en otra scope).
          # GHA cachea por branch con fallback a la default branch — perfecto
          # para PRs que heredan la cache de main.
          cache-from: type=gha,scope=sdk-integration-backend
          cache-to: type=gha,scope=sdk-integration-backend,mode=max

      - name: docker compose up
        # SIN --build: la imagen ya está cargada por el step anterior. Si por
        # algún motivo no estuviera, compose abortaría con "image not found"
        # antes de levantar dependencias — falla rápida y obvia, mejor que
        # gastar 10 min rebuilding en silencio.
        run: |
          # Inyectar UID_GID para que el sdk-runner cree node_modules/ como el
          # runner-user (ver doc en publish-sdks.yml).
          export UID_GID="$(id -u):$(id -g)"
          docker compose -f docker-compose.sdk-integration.yml up --no-build \
            --abort-on-container-exit --exit-code-from sdk-runner

      - name: dump backend logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.sdk-integration.yml logs backend || true
          docker compose -f docker-compose.sdk-integration.yml logs clickhouse || true
