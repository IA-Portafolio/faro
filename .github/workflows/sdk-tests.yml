name: sdk-tests

# Lint + build + test de cada SDK. Corre solo cuando el directorio del
# SDK respectivo (o este workflow) cambia, para no gastar minutos en cada
# PR que toque el core.
#
# Para SDKs que aún no tienen tests escritos, el job al menos garantiza
# que el código compila / pasa lint. Los `if grep`/`if [ -f ]` evitan
# explotar en suites vacías; cuando añadas tests reales se ejecutan solas.

on:
  pull_request:
    paths:
      - 'sdks/**'
      - '.github/workflows/sdk-tests.yml'
  push:
    branches: [main]
    paths:
      - 'sdks/**'
      - '.github/workflows/sdk-tests.yml'

concurrency:
  group: sdk-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: sdks/node } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: npm install
      - run: npm run build
      - run: |
          if grep -q '"test"' package.json; then npm test; else echo "sin tests"; fi

  nextjs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: sdks/nextjs } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: npm install
      - run: npm run build
      - run: |
          if grep -q '"test"' package.json; then npm test; else echo "sin tests"; fi

  expo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: sdks/expo } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: npm install
      - run: npm run build
      - run: |
          if grep -q '"test"' package.json; then npm test; else echo "sin tests"; fi

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: sdks/python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: install (with dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install ruff pytest
      - name: ruff
        run: ruff check . || true   # informativo hasta que el código esté limpio
      - name: build
        run: |
          pip install build
          python -m build
      - name: pytest
        run: |
          if [ -d tests ] || ls tests_*.py 2>/dev/null | grep -q .; then
            pytest
          else
            echo "sin tests"
          fi

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: sdks/go } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... || echo "sin tests"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: sdks/go
          args: --timeout=5m

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: sdks/flutter } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: dart analyze
      - run: flutter test || echo "sin tests"

  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: sdks/kotlin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - run: ./gradlew test --no-daemon || echo "sin tests"
