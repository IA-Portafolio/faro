name: codeql

# Análisis estático de seguridad de GitHub. Cubre los lenguajes con
# motor CodeQL nativo: JavaScript/TypeScript (frontend + SDKs npm),
# Python (sdk python) y Go (sdk go). Java/Kotlin (sdk kotlin) está
# temporalmente EXCLUIDO — CodeQL aún no soporta Kotlin 2.4.0 (ver matriz).
# Rust (backend) y Dart (sdk flutter) no están soportados oficialmente
# por CodeQL — se cubren con cargo-audit y dart analyze respectivamente.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Semanal, lunes 7 AM UTC (cuando aparecen advisories nuevas que pueden
    # marcar código existente sin que haya habido cambios recientes).
    - cron: '0 7 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
          - language: python
          # go: build-mode MANUAL. Go NO soporta build-mode none (CodeQL exige
          # autobuild|manual) y el runner self-hosted no trae go en PATH;
          # instalamos go y compilamos el SDK entre init y analyze para que el
          # tracer de CodeQL extraiga los fuentes.
          - language: go
            build-mode: manual
          # java-kotlin EXCLUIDO temporalmente: el bundle de CodeQL (2.25.6) no
          # soporta Kotlin 2.4.0 ("KotlinVersionTooRecentError", soporta <2.3.30)
          # y el SDK subió a 2.4.0 (Dependabot #56/#60). No hay fix de config
          # posible. Re-agregar `- language: java-kotlin` (build-mode manual +
          # setup-java + setup-gradle + ./gradlew compileKotlin) cuando CodeQL
          # publique soporte para Kotlin 2.4. Mientras, el SDK Kotlin queda
          # cubierto por su job `kotlin` de sdk-tests.yml (compile + tests).
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # go (build-mode manual): setup-go ANTES de init. Para Go en modo manual,
      # `init` antepone en el PATH un wrapper de `go` que traza la compilación;
      # si setup-go corriera DESPUÉS de init, el go real shadowearía ese wrapper
      # y CodeQL no vería el build ("CodeQL detected code written in Go but this
      # run didn't build any of it"). Con setup-go antes, init gana precedencia.
      - if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: '1.25'

      - uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      # build manual de go ENTRE init y analyze, trazado por el wrapper que
      # init dejó en el PATH. `-a` fuerza recompilar (el runner persiste el
      # build-cache de Go; sin -a sería cache-hit y no invocaría al compilador).
      - if: matrix.language == 'go'
        working-directory: sdks/go
        run: go build -a ./...

      # autobuild solo si build-mode es autobuild (ninguno: js-ts/python usan el
      # default, go usa el build manual de arriba); este paso se saltea siempre.
      - if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4

      - uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4
        with:
          category: '/language:${{ matrix.language }}'
