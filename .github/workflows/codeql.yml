name: codeql

# Análisis estático de seguridad de GitHub. Cubre los lenguajes con
# motor CodeQL nativo: JavaScript/TypeScript (frontend + SDKs npm),
# Python (sdk python), Go (sdk go), Java/Kotlin (sdk kotlin).
# Rust (backend) y Dart (sdk flutter) no están soportados oficialmente
# por CodeQL — se cubren con cargo-audit y dart analyze respectivamente.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Semanal, lunes 7 AM UTC (cuando aparecen advisories nuevas que pueden
    # marcar código existente sin que haya habido cambios recientes).
    - cron: '0 7 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
          - language: python
          # go: build-mode none (extracción buildless) — el runner self-hosted
          # no tiene go en PATH y el autobuild fallaba con "Unable to locate
          # executable file: go"; buildless no compila ni necesita toolchain.
          - language: go
            build-mode: none
          # java-kotlin: build-mode MANUAL. Kotlin NO soporta build-mode none
          # (buildless es solo Java) → con none el autobuild corría en la raíz
          # sin compilar los .kt de sdks/kotlin y CodeQL fallaba con "no source
          # code seen during build" (configuration error). Compilamos el SDK
          # Kotlin entre init y analyze para que el tracer extraiga los fuentes.
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      # java-kotlin (build-mode manual): compilamos el SDK Kotlin con el mismo
      # setup que el job `kotlin` de sdk-tests.yml, ENTRE init y analyze, para
      # que el tracer de CodeQL vea los .kt. Sin esto: "no source code seen".
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92  # v6
      - if: matrix.language == 'java-kotlin'
        working-directory: sdks/kotlin
        run: |
          if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.7; fi
          ./gradlew compileKotlin compileTestKotlin --no-daemon

      # autobuild solo si build-mode es autobuild (ninguno hoy). go usa none
      # (buildless), java-kotlin usa manual (build arriba); este paso se saltea.
      - if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4

      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4
        with:
          category: '/language:${{ matrix.language }}'
