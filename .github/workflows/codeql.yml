name: codeql

# Análisis estático de seguridad de GitHub. Cubre los lenguajes con
# motor CodeQL nativo: JavaScript/TypeScript (frontend + SDKs npm),
# Python (sdk python), Go (sdk go), Java/Kotlin (sdk kotlin).
# Rust (backend) y Dart (sdk flutter) no están soportados oficialmente
# por CodeQL — se cubren con cargo-audit y dart analyze respectivamente.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Semanal, lunes 7 AM UTC (cuando aparecen advisories nuevas que pueden
    # marcar código existente sin que haya habido cambios recientes).
    - cron: '0 7 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
          - language: python
          - language: go
          - language: java-kotlin
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
