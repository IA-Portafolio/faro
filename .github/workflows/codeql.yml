name: codeql

# Análisis estático de seguridad de GitHub. Cubre los lenguajes con
# motor CodeQL nativo: JavaScript/TypeScript (frontend + SDKs npm),
# Python (sdk python), Go (sdk go), Java/Kotlin (sdk kotlin).
# Rust (backend) y Dart (sdk flutter) no están soportados oficialmente
# por CodeQL — se cubren con cargo-audit y dart analyze respectivamente.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Semanal, lunes 7 AM UTC (cuando aparecen advisories nuevas que pueden
    # marcar código existente sin que haya habido cambios recientes).
    - cron: '0 7 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
          - language: python
          # go y java-kotlin con build-mode: none (extracción buildless): el
          # runner self-hosted no tiene go/java en PATH y el autobuild fallaba
          # con "Unable to locate executable file: go". buildless no compila ni
          # necesita toolchain.
          - language: go
            build-mode: none
          - language: java-kotlin
            build-mode: none
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      # autobuild solo si build-mode es autobuild (ninguno hoy). Con build-mode:
      # none la extracción no compila, así que este paso se saltea.
      - if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4

      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4
        with:
          category: '/language:${{ matrix.language }}'
