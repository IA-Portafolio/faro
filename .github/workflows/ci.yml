name: ci

# Validación rápida del core (backend Rust + frontend SvelteKit) en cada PR
# y en push a `main`. Bloquea merges rotos antes de que deploy.yml los suba
# a producción. Los SDKs tienen su propio workflow (sdk-tests.yml).
#
# Los jobs se condicionan con `dorny/paths-filter@v3` para que un PR que sólo
# toca `frontend/` no levante CH ni recompile Rust, y un PR que sólo toca
# README/docs no corra nada. Cambios a `.github/workflows/ci.yml` SIEMPRE
# disparan todos los jobs (porque cualquier ajuste al workflow puede romper
# un job que pase localmente). Un job final `ci` agrega los resultados para
# branch protection (marca SOLO `ci` como required y los individuales no).

on:
  pull_request:
  push:
    branches: [main]

# paths-filter (job `changes`) llama a la API listFiles del PR; sin
# `pull-requests: read` el GITHUB_TOKEN da "Resource not accessible by
# integration" y el job falla, arrastrando al umbrella `ci`.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # SEGURIDAD: el runner `self-hosted, faro-ci` ES el host de producción
    # (mismo box que sirve Faro y aloja .env.prod + el socket de Docker). El
    # repo es PÚBLICO, así que un PR desde un fork podría ejecutar código no
    # confiable (build scripts de cargo, postinstall de npm, scripts/*.sh) en
    # producción. Este guard salta el pipeline entero para PRs de fork: como
    # todos los demás jobs dependen de `changes`, al saltarse este no se hace
    # checkout ni se corre nada del PR en el host. Los push a `main` y los PRs
    # del MISMO repo (colaboradores) sí corren. (Defensa en profundidad sobre
    # la política de "Require approval for fork PRs" del repo.)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      compose: ${{ steps.filter.outputs.compose }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'clickhouse/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            compose:
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - '.env.example'
              - '.env.prod.template'
              - '.github/workflows/ci.yml'
            migrations:
              - 'clickhouse/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 25
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        # Mapeo a 18123/19000 en el host del runner self-hosted porque el
        # server de infra ya tiene Faro de producción corriendo en 8123/9000.
        # Usar los mismos puertos colisionaría con el deploy en vivo.
        ports: ['18123:8123', '19000:9000']
        env:
          CLICKHOUSE_DB: faro
          CLICKHOUSE_USER: faro
          CLICKHOUSE_PASSWORD: faro
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        # ClickHouse necesita `nofile` alto o falla en boot con mlock/EMFILE
        # (docker-compose.yml de dev también lo levanta a 262144). Sin esto
        # el container se queda en "starting" hasta timeout en GH Actions.
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          # Con el SHA-pin el toolchain ya NO se infiere del ref `@stable`
          # (github.action_ref pasa a ser el SHA); hay que pasarlo explícito.
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: backend

      # cargo-nextest paraleliza tests CROSS-BINARY (los 11 archivos en
      # backend/tests/*.rs comparten un único pool), mientras que `cargo test`
      # corre cada binario uno a uno. Con el aislamiento por project_id de la
      # fixture en backend/tests/common/mod.rs, todos los tests son seguros de
      # correr concurrentemente sobre el mismo ClickHouse compartido.
      # Configuración en backend/.config/nextest.toml.
      - name: install cargo-nextest
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b  # v2
        with:
          tool: cargo-nextest

      - name: cargo fmt --check
        working-directory: backend
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings

      - name: Bootstrap ClickHouse schema
        # Aplica todos los init/ y migrations/ con el script compartido
        # (sentencia por sentencia — el HTTP API de CH solo ejecuta una por
        # POST — y ESTRICTO: cualquier sentencia rechazada corta el job, sin
        # `|| true`). Mismo bootstrap que usa docker-compose.test.yml vía
        # scripts/run-integration-tests.sh.
        # Puerto 18123 para no chocar con el CH de producción en el host
        # self-hosted (ver comment en `services.clickhouse.ports`).
        env:
          CLICKHOUSE_URL: http://localhost:18123
          CLICKHOUSE_USER: faro
          CLICKHOUSE_PASSWORD: faro
          CLICKHOUSE_DATABASE: faro
        run: bash scripts/apply-clickhouse-schema.sh

      - name: cargo nextest run
        working-directory: backend
        env:
          CLICKHOUSE_URL: http://localhost:18123
          CLICKHOUSE_USER: faro
          CLICKHOUSE_PASSWORD: faro
          CLICKHOUSE_DATABASE: faro
          FARO_INGEST_TOKEN: ci-test-token
        # --profile ci aplica retries=2 (amortigua flakes puntuales de CH) y
        # emite junit.xml. --no-fail-fast también está en el profile pero lo
        # repetimos en CLI por claridad. No corremos `cargo test --doc` porque
        # hoy el código no tiene doctests; si en el futuro se agregan, añadir
        # ese step (nextest no los soporta).
        run: cargo nextest run --profile ci --all-features --no-fail-fast

  backend-audit:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        # SHA-pin: el toolchain no se infiere del ref, pasarlo explícito.
        with:
          toolchain: stable

      - name: install cargo-audit
        # Binario precompilado (~5 s) vs `cargo install` (~2 min) cada corrida.
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b  # v2
        with:
          tool: cargo-audit

      - name: cargo audit --deny warnings
        working-directory: backend
        # `--deny warnings` arma el gate ESTRICTO contra el advisory DB de RustSec:
        #
        #   * `vulnerability`  — CVE clásico (ya bloqueaba antes con la action de
        #                        rustsec/audit-check; sigue cubierto acá).
        #   * `unmaintained`   — crate sin commits hace ~12 meses, sin parches
        #                        para próximos CVEs.
        #   * `yanked`         — release retirada de crates.io tras publicación
        #                        (suele significar bug grave que llegó a prod).
        #   * `unsound`        — warning de soundness (UB potencial en el crate).
        #   * `notice`         — aviso público del autor del crate.
        #
        # Sin este flag los cuatro últimos los imprime y termina con exit 0:
        # CI verde mientras la dep ya está rota.
        #
        # Si una transitiva queda unmaintained y NO hay parche upstream, agregar
        # el advisory a la lista `--ignore` de abajo con un comment que justifique
        # POR QUÉ se ignora y CUÁNDO se revisará. El ignore queda en el diff de
        # CI para que cada PR review lo vea — no se esconde en un dotfile.
        #
        # IGNORES ACTUALES:
        #   * RUSTSEC-2024-0436 — `paste 1.0.15` unmaintained desde 2024-10-07.
        #     Llega vía `utoipa-axum 0.1.3 → paste`. utoipa-axum 0.2.0 ya quitó
        #     la dep, pero es bump major y rompe los routers actuales. `paste`
        #     es proc-macro de soporte sin superficie accesible desde input
        #     externo. Subir a 0.2.x en el próximo barrido de deps.
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        working-directory: frontend
        run: npm ci || npm install

      - name: typecheck
        working-directory: frontend
        run: npm run check

      - name: build
        working-directory: frontend
        env:
          PUBLIC_API_BASE: http://localhost:8080
        run: npm run build

      - name: test
        working-directory: frontend
        run: npm test

      - name: npm audit (high+ only)
        working-directory: frontend
        # `npm audit` retorna no-cero si hay vulns ≥ nivel pedido; usamos
        # `--audit-level=high` para no romper por low/moderate transitorios.
        run: npm audit --omit=dev --audit-level=high

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: validate docker-compose
        # `.env.prod.template` intencionalmente NO contiene CLICKHOUSE_PASSWORD
        # (se inyecta en el deploy). Para que `docker compose config` no falle
        # por la regla `${VAR:?...}`, pasamos un placeholder via env.
        env:
          CLICKHOUSE_PASSWORD: ci-validate-placeholder
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.prod.yml --env-file .env.prod.template config >/dev/null

  migrations:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    # Garantiza que init/ + migrations/ son aplicables limpios sobre DB vacía
    # y que correr migrations/ DOS veces no rompe (bug clásico de "una migración
    # rompe en el segundo deploy"). El job `backend` aplica el mismo schema con
    # el bootstrap estricto compartido (scripts/apply-clickhouse-schema.sh);
    # este job suma lo que aquel no cubre: idempotencia (doble corrida de
    # migrations/) y el catálogo exhaustivo de tablas.
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 10
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        # Puertos 18123/19000 igual que el job `backend` (evitar colisión con
        # la instancia de producción en el host self-hosted).
        ports: ['18123:8123', '19000:9000']
        env:
          CLICKHOUSE_DB: faro
          CLICKHOUSE_USER: faro
          CLICKHOUSE_PASSWORD: faro
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        # ClickHouse necesita `nofile` alto o falla en boot con mlock/EMFILE
        # (docker-compose.yml de dev también lo levanta a 262144). Sin esto
        # el container se queda en "starting" hasta timeout en GH Actions.
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: test-migrations.sh (forward + idempotency + SHOW TABLES)
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: '19000'
          CLICKHOUSE_USER: faro
          CLICKHOUSE_PASSWORD: faro
          CLICKHOUSE_DATABASE: faro
        run: bash clickhouse/test-migrations.sh

  # Umbrella job para branch protection. Pasa si todos los jobs requeridos
  # terminaron en `success` o fueron `skipped` (porque sus paths no cambiaron);
  # falla si CUALQUIERA terminó en `failure` o `cancelled`. Esto permite tener
  # un único required check en main protection (`ci`) en lugar de exigir cada
  # job individual — que se rompería el momento que un PR no toca su path.
  ci:
    if: always()
    needs: [changes, backend, backend-audit, frontend, compose, migrations]
    runs-on: [self-hosted, faro-ci]
    steps:
      - name: Verify all jobs succeeded or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "needs results: $RESULTS"
          # `contains` con substring porque join devuelve "success,skipped,success".
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*)
              echo "::error::Al menos un job requerido terminó en failure/cancelled"
              exit 1
              ;;
          esac
          echo "Todos los jobs requeridos pasaron o fueron skipped sin error."
