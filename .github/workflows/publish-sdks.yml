name: publish-sdks

# Publica un SDK cuando se empuja un tag con formato `sdk-<lang>-v<semver>`.
# Cada job se filtra por el prefijo del tag, así que un tag dispara solo el job
# relevante. La versión del tag se inyecta en el manifiesto antes de publicar
# (npm version, sed en pyproject/pubspec/build.gradle.kts).
#
# Gates: cada job que publica un paquete a un registro externo (npm/PyPI/
# pub.dev/Maven Central) reproduce su batería de tests **antes** de hacer
# publish — los registros son append-only de facto (yank a las 24h o nunca),
# así que un test failure local es la única red de seguridad.
#
# El integration test se corre solo para SDKs no-mobile (CI dispara docker
# compose con el stack Faro completo). Es lento (~5 min) pero indispensable.
#
# Convenciones de tag:
#   sdk-node-v0.1.0       → @iaportafolio/node           (npm)
#   sdk-nextjs-v0.1.0     → @iaportafolio/nextjs         (npm)
#   sdk-expo-v0.1.0       → @iaportafolio/expo           (npm)
#   sdk-python-v0.1.0     → faro-sdk             (PyPI)
#   sdk-go-v0.1.0         → faro-go              (git tag → go modules)
#   sdk-flutter-v0.1.0    → faro_sdk             (pub.dev)
#   sdk-kotlin-v0.1.0     → com.iaportafolio:faro (Maven Central)

on:
  push:
    tags:
      - 'sdk-*-v*'
  workflow_dispatch:
    inputs:
      sdk:
        description: 'SDK a publicar (node|nextjs|expo|python|go|flutter|kotlin)'
        required: true
      version:
        description: 'Versión (sin "v")'
        required: true

permissions:
  contents: write   # crear releases en GitHub
  id-token: write   # npm/pypi trusted publishing

jobs:
  ctx:
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.parse.outputs.sdk }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sdk=${{ inputs.sdk }}" >> $GITHUB_OUTPUT
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            ref="${{ github.ref_name }}"           # ej: sdk-node-v0.1.0
            sdk="$(echo "$ref" | sed -E 's/^sdk-([^-]+)-v.*$/\1/')"
            ver="$(echo "$ref" | sed -E 's/^sdk-[^-]+-v(.*)$/\1/')"
            echo "sdk=$sdk" >> $GITHUB_OUTPUT
            echo "version=$ver" >> $GITHUB_OUTPUT
          fi

  # --------- Gates de test reusables (corren ANTES de cualquier publish) ---------
  # Filosofía: cada SDK reproduce su suite localmente en el job de publish para
  # garantizar que el commit exacto que se publica pasa los tests. Confiar solo
  # en el resultado de un workflow previo (PR check, push a main) deja un hueco
  # — alguien puede crear el tag desde un commit pre-merge o sin haber pasado
  # CI. El coste extra (~30 s por SDK) compensa frente a un paquete roto en npm.

  test-node:
    needs: ctx
    if: needs.ctx.outputs.sdk == 'node' || needs.ctx.outputs.sdk == 'nextjs' || needs.ctx.outputs.sdk == 'expo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - working-directory: sdks/${{ needs.ctx.outputs.sdk }}
        run: |
          npm install
          npm test

  test-python:
    needs: ctx
    if: needs.ctx.outputs.sdk == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest

  test-go:
    needs: ctx
    if: needs.ctx.outputs.sdk == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - working-directory: sdks/go
        run: go test -race ./...

  test-flutter:
    needs: ctx
    if: needs.ctx.outputs.sdk == 'flutter'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - working-directory: sdks/flutter
        run: |
          flutter pub get
          flutter test

  test-kotlin:
    needs: ctx
    if: needs.ctx.outputs.sdk == 'kotlin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: sdks/kotlin
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          ./gradlew test --no-daemon

  # Integration gate: stack real (CH + backend) + Node SDK envía un log y lo
  # consulta. El wire es el mismo en todos los SDKs, así que con uno alcanza
  # para detectar regresiones de protocolo (cambio en /api/v1/ingest/logs,
  # rename de campo en LogRow, etc). Bloquea cualquier publish que toque la
  # ingesta — Node/Next.js/Expo/Python/Go.
  test-integration:
    needs: ctx
    if: needs.ctx.outputs.sdk == 'node' || needs.ctx.outputs.sdk == 'nextjs' || needs.ctx.outputs.sdk == 'expo' || needs.ctx.outputs.sdk == 'python' || needs.ctx.outputs.sdk == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker compose -f docker-compose.sdk-integration.yml up --build \
            --abort-on-container-exit --exit-code-from sdk-runner
      - if: failure()
        run: |
          docker compose -f docker-compose.sdk-integration.yml logs backend || true
          docker compose -f docker-compose.sdk-integration.yml logs clickhouse || true

  npm-node:
    needs: [ctx, test-node, test-integration]
    if: needs.ctx.outputs.sdk == 'node'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - working-directory: sdks/node
        run: |
          npm pkg set version="${{ needs.ctx.outputs.version }}"
          npm install
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  npm-nextjs:
    needs: [ctx, test-node, test-integration]
    if: needs.ctx.outputs.sdk == 'nextjs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: 'https://registry.npmjs.org' }
      - working-directory: sdks/nextjs
        run: |
          npm pkg set version="${{ needs.ctx.outputs.version }}"
          npm install
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  npm-expo:
    needs: [ctx, test-node, test-integration]
    if: needs.ctx.outputs.sdk == 'expo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: 'https://registry.npmjs.org' }
      - working-directory: sdks/expo
        run: |
          npm pkg set version="${{ needs.ctx.outputs.version }}"
          npm install
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: [ctx, test-python, test-integration]
    if: needs.ctx.outputs.sdk == 'python'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/faro-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Set version
        working-directory: sdks/python
        run: |
          # Reemplaza la versión en pyproject.toml
          sed -i "s/^version = .*/version = \"${{ needs.ctx.outputs.version }}\"/" pyproject.toml
      - name: Build
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip build
          python -m build
      # Trusted publishing — configura el proyecto faro-sdk en PyPI con esta repo.
      # Alternativa: usar secret PYPI_API_TOKEN y `with: password: ...`.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist

  go:
    needs: [ctx, test-go, test-integration]
    if: needs.ctx.outputs.sdk == 'go'
    runs-on: ubuntu-latest
    steps:
      # Go modules indexa por tags del repo. Para un SDK que vive en un subdir
      # del monorepo, el tag debe tener prefijo de path: `sdks/go/v0.1.0`.
      # Re-tag el commit con ese formato para que `go get` lo encuentre.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Create go-modules-compatible tag
        run: |
          GO_TAG="sdks/go/v${{ needs.ctx.outputs.version }}"
          git config user.email "ci@iaportafolio.com"
          git config user.name "faro-ci"
          if git rev-parse "$GO_TAG" >/dev/null 2>&1; then
            echo "tag $GO_TAG already exists"
          else
            git tag "$GO_TAG" "${{ github.sha }}"
            git push origin "$GO_TAG"
          fi
      - name: Warm proxy.golang.org
        # proxy.golang.org case-folded path: mayúsculas se escapan como !letra.
        run: |
          curl -fsSL "https://proxy.golang.org/github.com/!i!a-!portafolio/faro/sdks/go/@v/v${{ needs.ctx.outputs.version }}.info" || true

  pub-dev:
    needs: [ctx, test-flutter]
    if: needs.ctx.outputs.sdk == 'flutter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Set version
        working-directory: sdks/flutter
        run: |
          sed -i "s/^version: .*/version: ${{ needs.ctx.outputs.version }}/" pubspec.yaml
      - name: Restore pub credentials
        # PUB_CREDENTIALS_JSON: el contenido del archivo ~/.config/dart/pub-credentials.json
        # que se obtiene corriendo `dart pub token add https://pub.dev` localmente.
        run: |
          mkdir -p ~/.config/dart
          printf '%s' "${{ secrets.PUB_CREDENTIALS_JSON }}" > ~/.config/dart/pub-credentials.json
      - working-directory: sdks/flutter
        run: |
          flutter pub get
          flutter pub publish --force

  maven-central:
    needs: [ctx, test-kotlin]
    if: needs.ctx.outputs.sdk == 'kotlin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set version
        working-directory: sdks/kotlin
        run: |
          sed -i "s/^version = .*/version = \"${{ needs.ctx.outputs.version }}\"/" build.gradle.kts
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: gpg
        with:
          gpg_private_key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Configure GPG for non-interactive signing
        # Sin esto gradle->gpg pide TTY al firmar (Inappropriate ioctl for device).
        # Volvemos a `useInMemoryPgpKeys` exportando la armored ahora que la
        # action ya importó la key — exportar desde el keyring local funciona
        # aunque el secret pase mal por env.
        env:
          PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          KEY_ID: ${{ steps.gpg.outputs.keyid }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf '%s\n' "use-agent" "pinentry-mode loopback" "batch" "no-tty" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          # Re-export armored desde el keyring que ya importó la action, y guárdalo
          # en una variable de entorno para que useInMemoryPgpKeys lo lea.
          ARMORED=$(gpg --batch --pinentry-mode loopback --passphrase "$PASSPHRASE" --armor --export-secret-keys "$KEY_ID")
          if [ -z "$ARMORED" ]; then
            echo "::error::no se pudo exportar la key $KEY_ID"
            exit 1
          fi
          # Compartir con el siguiente step via GITHUB_ENV (multiline syntax)
          {
            echo "GPG_ARMORED_KEY<<__END__"
            printf '%s\n' "$ARMORED"
            echo "__END__"
          } >> "$GITHUB_ENV"
          echo "gpg key exported OK"
      - name: Publish to OSSRH (Central)
        working-directory: sdks/kotlin
        env:
          ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.OSSRH_PASSWORD }}
          # La key se exportó en el step anterior dentro del propio runner;
          # ahora useInMemoryPgpKeys sí puede leerla porque viene del shell,
          # no del wrapper de secrets de GitHub.
          ORG_GRADLE_PROJECT_signingKey: ${{ env.GPG_ARMORED_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          # gradlew aún no existe en el repo — usamos gradle del runner
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          ./gradlew publish --no-daemon

  github-release:
    needs: [ctx]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
