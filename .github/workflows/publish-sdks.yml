name: publish-sdks

# Publica un SDK cuando se empuja un tag con formato `sdk-<lang>-v<semver>`.
# Cada job se filtra por el prefijo del tag, así que un tag dispara solo el job
# relevante. La versión del tag se inyecta en el manifiesto antes de publicar
# (npm version, sed en pyproject/pubspec/build.gradle.kts).
#
# Gates: cada job que publica un paquete a un registro externo (npm/PyPI/
# pub.dev/Maven Central) reproduce su batería de tests **antes** de hacer
# publish — los registros son append-only de facto (yank a las 24h o nunca),
# así que un test failure local es la única red de seguridad.
#
# El integration test se corre solo para SDKs no-mobile (CI dispara docker
# compose con el stack Faro completo). Es lento (~5 min) pero indispensable.
#
# Convenciones de tag:
#   sdk-node-v0.1.0       → @iaportafolio/node           (npm)
#   sdk-nextjs-v0.1.0     → @iaportafolio/nextjs         (npm)
#   sdk-expo-v0.1.0       → @iaportafolio/expo           (npm)
#   sdk-python-v0.1.0     → faro-sdk             (PyPI)
#   sdk-go-v0.1.0         → faro-go              (git tag → go modules)
#   sdk-flutter-v0.1.0    → faro_sdk             (pub.dev)
#   sdk-kotlin-v0.1.0     → com.iaportafolio:faro (Maven Central)

on:
  push:
    tags:
      - 'sdk-*-v*'
  workflow_dispatch:
    inputs:
      sdk:
        description: 'SDK a publicar (node|nextjs|expo|python|go|flutter|kotlin)'
        required: true
      version:
        description: 'Versión (sin "v")'
        required: true

# Least-privilege a nivel workflow: read por defecto. Cada job que publica
# eleva SÓLO lo que necesita (go + github-release → contents:write;
# pypi → id-token:write para trusted publishing OIDC; npm → id-token:write
# para provenance). Así un job de test comprometido no tiene write al repo.
permissions:
  contents: read

jobs:
  ctx:
    runs-on: [self-hosted, faro-ci]
    outputs:
      sdk: ${{ steps.parse.outputs.sdk }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        # Seguridad: NUNCA interpolar ${{ }} de input no confiable (tag,
        # workflow_dispatch) dentro del script `run:` — GitHub expande la
        # expresión ANTES de invocar el shell, así que un valor con
        # metacaracteres (git permite `, $(), ; en refnames) se ejecutaría
        # como código en el runner (que es el host de prod) → RCE. Patrón
        # seguro, igual que validate-tag.yml: pasar por env: y referenciar la
        # var entrecomillada, que llega como dato y nunca como texto del script.
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SDK: ${{ inputs.sdk }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}           # ej: sdk-node-v0.1.0
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            sdk="$INPUT_SDK"
            ver="$INPUT_VERSION"
          else
            sdk="$(printf '%s' "$REF_NAME" | sed -E 's/^sdk-([^-]+)-v.*$/\1/')"
            ver="$(printf '%s' "$REF_NAME" | sed -E 's/^sdk-[^-]+-v(.*)$/\1/')"
          fi

          # Validación defensiva del shape (mismo contrato que validate-tag.yml
          # y CONTRIBUTING.md). Con el env: de arriba ya no hay shell injection;
          # esto cierra dos huecos residuales: (a) GITHUB_OUTPUT injection vía
          # newline en un input de workflow_dispatch, y (b) que una versión
          # malformada llegue a npm/sed y publique un paquete roto. El match es
          # contra el string COMPLETO ([[ =~ ]] de bash, $ ancla fin de cadena),
          # así que un valor con newline NO pasa.
          lang_re='^(node|nextjs|expo|python|go|flutter|kotlin)$'
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$sdk" =~ $lang_re ]]; then
            echo "::error::SDK inválido: '$sdk' (esperado: node|nextjs|expo|python|go|flutter|kotlin)"
            exit 1
          fi
          if [[ ! "$ver" =~ $semver_re ]]; then
            echo "::error::Versión inválida: '$ver' (esperado semver MAJOR.MINOR.PATCH[-pre][+build])"
            exit 1
          fi

          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  # --------- Gates de test reusables (corren ANTES de cualquier publish) ---------
  # Filosofía: cada SDK reproduce su suite localmente en el job de publish para
  # garantizar que el commit exacto que se publica pasa los tests. Confiar solo
  # en el resultado de un workflow previo (PR check, push a main) deja un hueco
  # — alguien puede crear el tag desde un commit pre-merge o sin haber pasado
  # CI. El coste extra (~30 s por SDK) compensa frente a un paquete roto en npm.

  test-node:
    needs: ctx
    if: needs.ctx.outputs.sdk == 'node' || needs.ctx.outputs.sdk == 'nextjs' || needs.ctx.outputs.sdk == 'expo'
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with: { node-version: 20 }
      - working-directory: sdks/${{ needs.ctx.outputs.sdk }}
        # --legacy-peer-deps: nextjs declara `next` y `react` como peerDeps;
        # con npm 9+ ERESOLVE rompe el install cuando next@16 pide react@19
        # pero alguna otra dep transitiva está en react@18. node y expo no
        # tienen ese conflicto pero el flag tampoco les hace daño.
        run: |
          npm install --legacy-peer-deps
          npm test

  test-python:
    needs: ctx
    if: needs.ctx.outputs.sdk == 'python'
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: '3.11' }
      - working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest

  test-go:
    needs: ctx
    if: needs.ctx.outputs.sdk == 'go'
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with: { go-version: '1.22' }
      - working-directory: sdks/go
        run: go test -race ./...

  test-flutter:
    needs: ctx
    if: needs.ctx.outputs.sdk == 'flutter'
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with: { channel: stable }
      - working-directory: sdks/flutter
        run: |
          flutter pub get
          flutter test

  test-kotlin:
    needs: ctx
    if: needs.ctx.outputs.sdk == 'kotlin'
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6
      - working-directory: sdks/kotlin
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          ./gradlew test --no-daemon

  # Integration gate: stack real (CH + backend) + Node SDK envía un log y lo
  # consulta. El wire es el mismo en todos los SDKs, así que con uno alcanza
  # para detectar regresiones de protocolo (cambio en /api/v1/ingest/logs,
  # rename de campo en LogRow, etc). Bloquea cualquier publish que toque la
  # ingesta — Node/Next.js/Expo/Python/Go.
  test-integration:
    needs: ctx
    if: needs.ctx.outputs.sdk == 'node' || needs.ctx.outputs.sdk == 'nextjs' || needs.ctx.outputs.sdk == 'expo' || needs.ctx.outputs.sdk == 'python' || needs.ctx.outputs.sdk == 'go'
    runs-on: [self-hosted, faro-ci]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |
          # UID_GID se inyecta para que el sdk-runner cree node_modules/ con
          # ownership del runner-user en vez de root (sino el siguiente
          # actions/checkout falla con EACCES intentando limpiar el workspace).
          export UID_GID="$(id -u):$(id -g)"
          docker compose -f docker-compose.sdk-integration.yml up --build \
            --abort-on-container-exit --exit-code-from sdk-runner
      - if: failure()
        run: |
          docker compose -f docker-compose.sdk-integration.yml logs backend || true
          docker compose -f docker-compose.sdk-integration.yml logs clickhouse || true

  npm-node:
    needs: [ctx, test-node, test-integration]
    if: needs.ctx.outputs.sdk == 'node'
    runs-on: [self-hosted, faro-ci]
    permissions:
      contents: read
      id-token: write   # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - working-directory: sdks/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.ctx.outputs.version }}
        run: |
          npm pkg set version="$VERSION"
          npm install --legacy-peer-deps
          npm run build
          npm publish --access public

  npm-nextjs:
    needs: [ctx, test-node, test-integration]
    if: needs.ctx.outputs.sdk == 'nextjs'
    runs-on: [self-hosted, faro-ci]
    permissions:
      contents: read
      id-token: write   # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with: { node-version: 20, registry-url: 'https://registry.npmjs.org' }
      - working-directory: sdks/nextjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.ctx.outputs.version }}
        run: |
          npm pkg set version="$VERSION"
          npm install --legacy-peer-deps
          npm run build
          npm publish --access public

  npm-expo:
    needs: [ctx, test-node, test-integration]
    if: needs.ctx.outputs.sdk == 'expo'
    runs-on: [self-hosted, faro-ci]
    permissions:
      contents: read
      id-token: write   # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with: { node-version: 20, registry-url: 'https://registry.npmjs.org' }
      - working-directory: sdks/expo
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.ctx.outputs.version }}
        run: |
          npm pkg set version="$VERSION"
          npm install --legacy-peer-deps
          npm run build
          npm publish --access public

  pypi:
    needs: [ctx, test-python, test-integration]
    if: needs.ctx.outputs.sdk == 'python'
    runs-on: [self-hosted, faro-ci]
    permissions:
      contents: read
      id-token: write   # PyPI trusted publishing (OIDC, sin password)
    environment:
      name: pypi
      url: https://pypi.org/p/faro-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: '3.11' }
      - name: Set version
        working-directory: sdks/python
        env:
          VERSION: ${{ needs.ctx.outputs.version }}
        run: |
          # Reemplaza la versión en pyproject.toml
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
      - name: Build
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip build
          python -m build
      # Trusted publishing — configura el proyecto faro-sdk en PyPI con esta repo.
      # Alternativa: usar secret PYPI_API_TOKEN y `with: password: ...`.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          packages-dir: sdks/python/dist

  go:
    needs: [ctx, test-go, test-integration]
    if: needs.ctx.outputs.sdk == 'go'
    runs-on: [self-hosted, faro-ci]
    permissions:
      contents: write   # git push del tag go-modules `sdks/go/vX`
    steps:
      # Go modules indexa por tags del repo. Para un SDK que vive en un subdir
      # del monorepo, el tag debe tener prefijo de path: `sdks/go/v0.1.0`.
      # Re-tag el commit con ese formato para que `go get` lo encuentre.
      # Excepción deliberada a persist-credentials:false (resto de checkouts):
      # este job hace `git push origin "$GO_TAG"`, que necesita el token
      # persistido en .git/config. Por eso conserva credenciales (y el job
      # tiene contents:write). fetch-depth:0 para que el tag apunte al commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0, persist-credentials: true }  # zizmor: ignore[artipacked]
      - name: Create go-modules-compatible tag
        env:
          VERSION: ${{ needs.ctx.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          GO_TAG="sdks/go/v$VERSION"
          git config user.email "ci@iaportafolio.com"
          git config user.name "faro-ci"
          if git rev-parse "$GO_TAG" >/dev/null 2>&1; then
            echo "tag $GO_TAG already exists"
          else
            git tag "$GO_TAG" "$SHA"
            git push origin "$GO_TAG"
          fi
      - name: Warm proxy.golang.org
        # proxy.golang.org case-folded path: mayúsculas se escapan como !letra.
        env:
          VERSION: ${{ needs.ctx.outputs.version }}
        run: |
          curl -fsSL "https://proxy.golang.org/github.com/!i!a-!portafolio/faro/sdks/go/@v/v$VERSION.info" || true

  pub-dev:
    needs: [ctx, test-flutter]
    if: needs.ctx.outputs.sdk == 'flutter'
    runs-on: [self-hosted, faro-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with: { channel: stable }
      - name: Set version
        working-directory: sdks/flutter
        env:
          VERSION: ${{ needs.ctx.outputs.version }}
        run: |
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml
      - name: Restore pub credentials
        # PUB_CREDENTIALS_JSON: el contenido del archivo ~/.config/dart/pub-credentials.json
        # que se obtiene corriendo `dart pub token add https://pub.dev` localmente.
        # Si el secret está vacío/inválido, `flutter pub publish` queda colgado
        # esperando OAuth interactivo (que en CI nunca llega) — chequeamos antes.
        env:
          PUB_CREDENTIALS_JSON: ${{ secrets.PUB_CREDENTIALS_JSON }}
        run: |
          mkdir -p ~/.config/dart
          printf '%s' "$PUB_CREDENTIALS_JSON" > ~/.config/dart/pub-credentials.json
          if [ ! -s ~/.config/dart/pub-credentials.json ]; then
            echo "::error::PUB_CREDENTIALS_JSON está vacío — regenera con 'dart pub token add https://pub.dev'"
            exit 1
          fi
          # Smoke: dart parsea el file y muestra los tokens registrados (no
          # contacta a pub.dev, solo verifica que el JSON es válido).
          dart pub token list || { echo "::error::pub-credentials.json malformado"; exit 1; }
      - working-directory: sdks/flutter
        # Timeout 5 min: si pasa de eso es OAuth interactivo colgado. Tirar
        # rápido para que el siguiente push tenga el runner libre, no colgado
        # 6h como pasó en el batch anterior.
        timeout-minutes: 5
        env:
          # Dart explícitamente NO-interactive: si el token está expirado el
          # comando falla en vez de redirigir a OAuth.
          PUB_HOSTED_URL: https://pub.dev
        run: |
          flutter pub get
          flutter pub publish --force

  maven-central:
    needs: [ctx, test-kotlin]
    if: needs.ctx.outputs.sdk == 'kotlin'
    runs-on: [self-hosted, faro-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set version
        working-directory: sdks/kotlin
        env:
          VERSION: ${{ needs.ctx.outputs.version }}
        run: |
          sed -i "s/^version = .*/version = \"$VERSION\"/" build.gradle.kts
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd  # v7
        id: gpg
        with:
          gpg_private_key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Configure GPG armored key for Gradle
        # Antes hacíamos re-export desde el keyring local con
        # `gpg --export-secret-keys`. En self-hosted eso falla con
        # "Bad passphrase" porque la subkey tiene un keygrip distinto
        # al cacheado por crazy-max y el agent rechaza el preset.
        # Solución: usar el secret raw directamente — MAVEN_GPG_PRIVATE_KEY
        # ya viene armored (`-----BEGIN PGP PRIVATE KEY BLOCK-----`),
        # `useInMemoryPgpKeys` de Gradle lo come tal cual sin tocar el agent.
        env:
          ARMORED_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ARMORED_KEY_B64: ${{ secrets.MAVEN_GPG_PRIVATE_KEY_B64 }}
        run: |
          # Preferir la versión armored directa; caer al B64 si la primera
          # no contiene el header esperado (algunos repos solo tienen B64).
          if printf '%s' "$ARMORED_KEY" | grep -q "BEGIN PGP PRIVATE KEY"; then
            FINAL="$ARMORED_KEY"
          elif [ -n "$ARMORED_KEY_B64" ]; then
            FINAL=$(printf '%s' "$ARMORED_KEY_B64" | base64 -d)
          else
            echo "::error::ni MAVEN_GPG_PRIVATE_KEY ni MAVEN_GPG_PRIVATE_KEY_B64 contienen una key utilizable"
            exit 1
          fi
          if ! printf '%s' "$FINAL" | grep -q "BEGIN PGP PRIVATE KEY"; then
            echo "::error::la key resuelta no tiene formato armored válido"
            exit 1
          fi
          # Normalizar line endings — si el secret se pegó desde Windows
          # quedan CRLF y BouncyCastle rechaza con "Could not read PGP
          # secret key" sin más detalle.
          FINAL=$(printf '%s' "$FINAL" | tr -d '\r')
          # Si la key entera vino en UNA sola línea (GitHub UI a veces hace
          # eso), reconstruir newlines: BEGIN header, body en chunks de 64
          # chars (formato armored estándar), END footer. La heurística
          # (sin imprimir nada derivado del secret) usa `wc -l`.
          if [ "$(printf '%s' "$FINAL" | wc -l)" -le 2 ]; then
            echo "::warning::secret en una sola línea, reconstruyendo formato armored"
            BODY=$(printf '%s' "$FINAL" | sed -E 's|.*-----BEGIN PGP PRIVATE KEY BLOCK-----||; s|-----END PGP PRIVATE KEY BLOCK-----.*||')
            FINAL=$(printf '%s\n%s\n%s\n' \
              "-----BEGIN PGP PRIVATE KEY BLOCK-----" \
              "$(printf '%s' "$BODY" | fold -w 64)" \
              "-----END PGP PRIVATE KEY BLOCK-----")
          fi
          {
            echo "GPG_ARMORED_KEY<<__END__"
            printf '%s\n' "$FINAL"
            echo "__END__"
          } >> "$GITHUB_ENV"
          echo "armored key OK"
      - name: Publish to OSSRH (Central)
        working-directory: sdks/kotlin
        env:
          ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.OSSRH_PASSWORD }}
          # La key se exportó en el step anterior dentro del propio runner;
          # ahora useInMemoryPgpKeys sí puede leerla porque viene del shell,
          # no del wrapper de secrets de GitHub.
          ORG_GRADLE_PROJECT_signingKey: ${{ env.GPG_ARMORED_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          # gradlew aún no existe en el repo — usamos gradle del runner
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          # `./gradlew publish` deja el bundle en el staging local del plugin
          # nmcp pero NO lo envía a Sonatype Central Portal — el deployment
          # queda en limbo y el package nunca aparece como "published".
          # `publishAllPublicationsToCentralPortal` es la task del plugin
          # nmcp 0.0.9 que sí sube el bundle a https://central.sonatype.com/
          # (con publicationType="AUTOMATIC" en build.gradle.kts, Sonatype
          # valida y publica solo tras el upload).
          ./gradlew publishAllPublicationsToCentralPortal --no-daemon

  github-release:
    needs: [ctx]
    if: github.event_name == 'push'
    runs-on: [self-hosted, faro-ci]
    permissions:
      contents: write   # crear el GitHub Release del tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
