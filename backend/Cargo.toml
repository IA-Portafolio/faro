[package]
name = "faro"
version = "0.1.0"
edition = "2021"
description = "Faro - centralized observability platform"
license = "LicenseRef-Proprietary"
publish = false

[[bin]]
name = "faro"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "tokio"] }
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
regex = "1"
sha2 = "0.10"
hex = "0.4"
url = "2"
bytes = "1"
parking_lot = "0.12"
rand = "0.8"
argon2 = "0.5"
axum-extra = { version = "0.12", features = ["query", "cookie"] }
time = "0.3"

# OpenAPI / Swagger
# `utoipa` deriva el schema desde tipos Rust; `utoipa-axum` lo integra con
# axum::Router para mantener el documento en sync con las rutas reales.
# Ver docs/adr/0006-openapi-utoipa.md
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.1"
utoipa-swagger-ui = { version = "8", features = ["axum"] }

# Self-observability — opt-in vía FARO_SELF_OBSERVE=true. Emite traces,
# logs y métricas del propio backend al endpoint OTLP local (`:4318`).
# Ver docs/adr/0007-self-observability.md
opentelemetry = { version = "0.27", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.27", default-features = false, features = ["trace", "metrics", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "reqwest-rustls", "trace", "metrics", "logs"] }
opentelemetry-semantic-conventions = "0.27"
tracing-opentelemetry = { version = "0.28", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
