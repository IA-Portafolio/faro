[package]
name = "faro"
version = "0.1.0"
edition = "2021"
description = "Faro - centralized observability platform"
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "faro"
path = "src/lib.rs"

[[bin]]
name = "faro"
path = "src/main.rs"

# Lints estilísticos que aparecieron con clippy 1.85+ contra código que se
# escribió con clippy de Rust 1.83/1.84. Son ruido, no bugs — los desactivamos
# acá en bloque para que CI vuelva a verde. TODO: revisar caso por caso cuando
# haya tiempo y bajar nuevamente a `deny`.
[lints.clippy]
cloned_ref_to_slice_refs = "allow"
doc_overindented_list_items = "allow"
doc_lazy_continuation = "allow"
result_large_err = "allow"
too_many_arguments = "allow"
new_without_default = "allow"
manual_is_multiple_of = "allow"
needless_range_loop = "allow"
unnecessary_map_or = "allow"
manual_clamp = "allow"
map_entry = "allow"
field_reassign_with_default = "allow"
bool_comparison = "allow"
nonminimal_bool = "allow"
unnecessary_cast = "allow"
while_let_loop = "allow"
approx_constant = "allow"

[lints.rust]
dead_code = "allow"
unused_imports = "allow"

[dependencies]
axum = { version = "0.8", features = ["macros", "tokio"] }
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "compression-br", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
regex = "1"
sha2 = "0.11"
hex = "0.4"
url = "2"
bytes = "1"
parking_lot = "0.12"
rand = "0.9"
argon2 = "0.5"
axum-extra = { version = "0.12", features = ["query", "cookie"] }
time = "0.3"

# OpenAPI. `utoipa` deriva el schema desde tipos Rust; `utoipa-axum` lo integra
# con axum::Router para mantener el documento en sync con las rutas reales.
# La UI pública la sirve Scalar (HTML estático en `api::mod::SCALAR_HTML`),
# no `utoipa-swagger-ui` — sacamos ese crate para eliminar el build.rs que
# descargaba el bundle de Swagger via curl. Ver docs/adr/0006-openapi-utoipa.md.
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"

# Self-observability — opt-in vía FARO_SELF_OBSERVE=true. Emite traces,
# logs y métricas del propio backend al endpoint OTLP local (`:4318`).
# Ver docs/adr/0007-self-observability.md
opentelemetry = { version = "0.27", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.27", default-features = false, features = ["trace", "metrics", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "reqwest-rustls", "trace", "metrics", "logs"] }
opentelemetry-semantic-conventions = "0.27"
tracing-opentelemetry = { version = "0.28", default-features = false }

# Ingesta OTLP/gRPC en :4317 — los SDKs oficiales de OpenTelemetry usan gRPC+protobuf
# por defecto, así que sin esto un cliente Java/Go/Python "stock" falla en silencio.
# `opentelemetry-proto` con `gen-tonic` trae los stubs ya generados, evitando
# tener que vendorear los .proto y configurar `build.rs` con protoc.
tonic = "0.14"
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "trace", "metrics", "logs"] }

# Rate limit por proyecto en la ingesta (token bucket GCRA). In-memory por proceso —
# con un único backend por instancia no necesitamos coordinación distribuida. Si en
# algún momento corremos múltiples nodos, esto migra a Redis manteniendo la misma
# interfaz (`IngestLimiter::check`).
governor = "0.7"

# Métricas Prometheus del propio backend. Faro mide a las apps; este exporter
# permite que un Prometheus externo mida a Faro (Tier 1: ingesta por proyecto,
# duración de INSERT a ClickHouse, errores, latencia HTTP). axum-prometheus
# instala globalmente un recorder del crate `metrics`, así que los counters/
# histograms/gauges custom usan los macros re-exportados de `metrics`.
#
# CRÍTICO: `metrics` debe ser la MISMA versión mayor que la que usa
# `axum-prometheus` (vía `metrics-exporter-prometheus`). Cada versión de
# `metrics` tiene su propio recorder global estático: si el app emite con
# `metrics` 0.24 pero axum-prometheus instala un recorder 0.23, TODOS los
# `metrics::counter!/gauge!/histogram!` custom son no-ops silenciosos (sólo
# renderizan las métricas HTTP del propio layer). axum-prometheus 0.10 →
# metrics-exporter-prometheus 0.18 → metrics 0.24, así que acá fijamos 0.24.
# El test `tests/metrics_endpoint.rs` falla si el split reaparece: al subir
# axum-prometheus hay que mover `metrics` a la mayor que use su exporter.
axum-prometheus = "0.10"
metrics = "0.24"

# 2FA TOTP (RFC 6238). `totp-rs` con `gen_secret` produce el secreto Base32 y
# el otpauth:// URL para enrolar la cuenta en Google Authenticator / Authy / 1Password.
# Sin features de QR — generamos el SVG con `qrcode` por separado para evitar
# arrastrar `image` y `qrcodegen` como deps transitivas pesadas.
totp-rs = { version = "5", default-features = false, features = ["gen_secret", "otpauth"] }
# QR como SVG inline en el JSON de setup. Pure Rust, sin deps de imagen.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
# Habilita `tokio::time::pause()/advance()` y `#[tokio::test(start_paused = true)]`,
# necesarios para `tests/workers_alert_evaluator.rs::spawned_loop_evaluates_after_advance`
# y para cualquier test futuro que necesite avanzar el clock de tokio sin esperar
# wall-clock real. Solo se compila para `cargo test`; no afecta al binario.
tokio = { version = "1.40", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
