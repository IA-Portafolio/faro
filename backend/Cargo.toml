[package]
name = "faro"
version = "0.1.0"
edition = "2021"
description = "Faro - centralized observability platform"
license = "MIT"

[[bin]]
name = "faro"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "tokio"] }
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
regex = "1"
sha2 = "0.10"
hex = "0.4"
url = "2"
bytes = "1"
parking_lot = "0.12"
rand = "0.8"
argon2 = "0.5"
axum-extra = { version = "0.9", features = ["query", "cookie"] }
time = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
