name: faro_sdk
description: Faro SDK for Flutter / Dart — logs, captured exceptions, product analytics (track/identify/alias) and tracing context to a Faro instance.
version: 0.1.0
homepage: https://github.com/iaportafolio/faro
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  # analysis_options.yaml hace `include: package:flutter_lints/flutter.yaml`;
  # sin esta dep el include no resuelve y `dart analyze` falla con
  # include_file_not_found. ^4.0.0 es compatible con sdk Dart >=3.0.0.
  flutter_lints: ^4.0.0
