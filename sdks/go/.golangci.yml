run:
  timeout: 5m
  go: "1.22"

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - gocritic
    # misspell deshabilitado: el codebase tiene comentarios en español y el
    # linter (solo inglés) marca falsos positivos ("producto"→production,
    # "variantes"→variants). No hay forma de enseñarle español salvo una lista
    # ignore-words inmanejable, así que se desactiva.

linters-settings:
  revive:
    rules:
      - name: exported
        arguments: ["checkPrivateReceivers", "sayRepetitiveInsteadOfStutters"]

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
