[package]
name = "farocli"
version = "0.1.0"
edition = "2021"
description = "CLI para Faro — tail de logs, queries rápidas y gestión de monitores desde la terminal."
license = "LicenseRef-Proprietary"
publish = false

[[bin]]
name = "farocli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# `dirs` da el directorio de config OS-aware sin pelearse con `%APPDATA%` en Windows.
dirs = "5"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
strip = "symbols"
