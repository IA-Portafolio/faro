# Stack mínimo (clickhouse + redis + backend) que CI levanta para el
# `sdk-integration` job. Sin frontend (no aporta al smoke), sin volúmenes
# persistentes (cada run arranca limpio), sin puertos publicados — los SDKs
# se conectan vía la red interna del compose desde el container `sdk-runner`.
#
# Uso (local):
#   docker compose -f docker-compose.sdk-integration.yml up --build \
#     --abort-on-container-exit --exit-code-from sdk-runner
#
# CRÍTICO: el project name fijo `faro-sdk-integration` es lo que separa
# este stack del `faro` de producción. Sin esto, docker compose toma el
# nombre del directorio padre (típicamente `faro` cuando se clona el
# repo así) y termina reusando los volúmenes `faro_clickhouse_data` /
# `faro_redis_data` de prod — el integration test escribiría en la base
# en vivo y el bootstrap_admin no se dispararía porque ya habría usuarios.
name: faro-sdk-integration

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: faro
      CLICKHOUSE_USER: faro
      CLICKHOUSE_PASSWORD: faro
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config/users.d/faro.xml:/etc/clickhouse-server/users.d/faro.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  backend:
    # Tag explícito para que CI pueda pre-buildear con buildx + cache-from=gha
    # y compose lo reuse sin pasar por su builder propio (que no entiende los
    # exporters de buildx). Si la imagen no existe en local, `build:` la genera
    # — eso cubre el flujo local (`docker compose up --build`).
    image: faro-backend:integration
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      clickhouse: { condition: service_healthy }
      redis:      { condition: service_healthy }
    environment:
      FARO_BIND_ADDR: 0.0.0.0:4318
      FARO_OTLP_GRPC_ADDR: 0.0.0.0:4317
      FARO_API_ADDR: 0.0.0.0:8080
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: faro
      CLICKHOUSE_USER: faro
      CLICKHOUSE_PASSWORD: faro
      REDIS_URL: redis://redis:6379
      FARO_INGEST_TOKEN: dev-ingest-token
      FARO_BOOTSTRAP_PROJECT_SLUG: default
      FARO_BOOTSTRAP_PROJECT_NAME: Default
      FARO_BOOTSTRAP_INGEST_TOKEN: dev-ingest-token
      FARO_BOOTSTRAP_ADMIN_EMAIL: admin@local.test
      FARO_BOOTSTRAP_ADMIN_PASSWORD: admin12345
      FARO_BOOTSTRAP_ADMIN_NAME: Admin
      RUST_LOG: warn,faro=info
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 2s
      retries: 40

  sdk-runner:
    image: node:20-alpine
    depends_on:
      backend: { condition: service_healthy }
    working_dir: /work
    volumes:
      - ./sdks/node:/work
    # Correr como el UID/GID del host evita dejar `node_modules/` como root
    # en el bind mount. En CI self-hosted ese basura rompe el `actions/checkout`
    # del siguiente run con EACCES porque el runner-user no puede `rmdir`.
    # Si UID_GID no está seteado, default a 1000:1000 (estándar Debian/Ubuntu —
    # `victalejo` en infra-iaportafolio coincide con ese UID).
    user: "${UID_GID:-1000:1000}"
    environment:
      FARO_ENDPOINT: http://backend:8080
      FARO_TOKEN: dev-ingest-token
      # npm cache out-of-mount; `/home/node` puede no ser writable para el UID externo.
      npm_config_cache: /tmp/.npm
    # Reinstala (npm ci falla con package-lock obsoleto en CI) y dispara la suite
    # de integración que vive junto al SDK.
    entrypoint: ["sh", "-c", "npm install --no-audit --no-fund && node tests-integration/run.mjs"]
